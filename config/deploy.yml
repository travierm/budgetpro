service: budgetpro
image: moorlagt/budgetpro
minimum_version: 2.12.0

servers:
  web:
    - tecdrip.com

proxy:
  ssl: true
  host: budgetpro.tecdrip.com
  app_port: 3000
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

registry:
  username: moorlagt
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

asset_path: /app/dist/assets
